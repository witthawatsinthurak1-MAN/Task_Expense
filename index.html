<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task & Expense System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FullCalendar CSS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .modal-content { border-radius: 1rem; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .card { border-radius: 0.75rem; border: none; }
    </style>
</head>
<body>

    <!-- 🔐 หน้าแรกตอนยังไม่ล็อกอิน -->
    <div id="authContainer" class="container d-flex flex-column justify-content-center align-items-center vh-100">
        <div class="text-center mb-4">
            <i class="fas fa-wallet fa-3x text-primary mb-3"></i>
            <h1 class="fw-bold">Task & Expense Tracker</h1>
            <p class="text-muted">ระบบจัดการงานและบัญชีรายรับ-รายจ่ายส่วนตัว</p>
            <button class="btn btn-primary btn-lg px-5 shadow-sm rounded-pill" data-bs-toggle="modal" data-bs-target="#authModal">
                <i class="fas fa-sign-in-alt me-2"></i>เข้าสู่ระบบ / สมัครสมาชิก
            </button>
        </div>
    </div>

    <!-- 🌟 Modal Popup สำหรับ Login / Register -->
    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4">
                <div class="modal-header border-0 pb-0">
                    <h4 class="modal-title fw-bold" id="authTitle">เข้าสู่ระบบ</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Login Form -->
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                                <input type="text" class="form-control bg-light border-start-0" id="loginUser" placeholder="กรอกชื่อผู้ใช้" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-secondary fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" class="form-control bg-light border-start-0" id="loginPass" placeholder="กรอกรหัสผ่าน" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3 fw-bold shadow-sm">เข้าสู่ระบบ</button>
                        <p class="text-center text-muted mb-0">ยังไม่มีบัญชี? <a href="#" onclick="toggleAuthModal(true)" class="text-primary text-decoration-none fw-bold">สมัครสมาชิก</a></p>
                    </form>

                    <!-- Register Form -->
                    <form id="registerForm" class="d-none">
                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">ชื่อ-นามสกุล</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-id-card text-muted"></i></span>
                                <input type="text" class="form-control bg-light border-start-0" id="regName" placeholder="กรอกชื่อของคุณ" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                                <input type="text" class="form-control bg-light border-start-0" id="regUser" placeholder="ตั้งชื่อผู้ใช้" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-secondary fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" class="form-control bg-light border-start-0" id="regPass" placeholder="ตั้งรหัสผ่าน" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 mb-3 fw-bold shadow-sm">ยืนยันการสมัครสมาชิก</button>
                        <p class="text-center text-muted mb-0">มีบัญชีอยู่แล้ว? <a href="#" onclick="toggleAuthModal(false)" class="text-primary text-decoration-none fw-bold">เข้าสู่ระบบ</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 📊 หน้าแดชบอร์ดหลัก (แสดงผลหลัง Login สำเร็จ) -->
    <div id="appContainer" class="d-none">
        <nav class="navbar navbar-dark bg-dark shadow-sm">
            <div class="container-fluid px-4">
                <a class="navbar-brand fw-bold" href="#"><i class="fas fa-wallet me-2"></i>Task & Expense System</a>
                <button class="btn btn-outline-light btn-sm px-3 rounded-pill" onclick="logout()"><i class="fas fa-sign-out-alt me-1"></i>ออกจากระบบ</button>
            </div>
        </nav>

        <div class="container my-4">
            <!-- Summary Cards -->
            <div class="row g-3 mb-4">
                <div class="col-md-4"><div class="card bg-primary text-white shadow-sm p-3"><h6 class="text-white-50">รายรับรวม</h6><h3 id="totalIncome" class="fw-bold mb-0">0.00 ฿</h3></div></div>
                <div class="col-md-4"><div class="card bg-danger text-white shadow-sm p-3"><h6 class="text-white-50">รายจ่ายรวม</h6><h3 id="totalExpense" class="fw-bold mb-0">0.00 ฿</h3></div></div>
                <div class="col-md-4"><div class="card bg-success text-white shadow-sm p-3"><h6 class="text-white-50">ยอดคงเหลือ</h6><h3 id="netBalance" class="fw-bold mb-0">0.00 ฿</h3></div></div>
            </div>

            <div class="row g-4">
                <!-- Forms -->
                <div class="col-lg-4">
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-white fw-bold py-3">➕ เพิ่มงานใหม่</div>
                        <div class="card-body">
                            <form id="taskForm">
                                <div class="mb-3"><label class="form-label">ชื่องาน</label><input type="text" class="form-control" id="taskTitle" required></div>
                                <div class="mb-3"><label class="form-label">รายละเอียด</label><textarea class="form-control" id="taskDesc" rows="2"></textarea></div>
                                <div class="mb-3"><label class="form-label">กำหนดส่ง</label><input type="date" class="form-control" id="taskDueDate" required></div>
                                <button type="submit" class="btn btn-primary w-100 fw-bold">บันทึกงาน</button>
                            </form>
                        </div>
                    </div>

                    <div class="card shadow-sm">
                        <div class="card-header bg-white fw-bold py-3">💰 เพิ่มรายรับ-รายจ่าย</div>
                        <div class="card-body">
                            <form id="txForm">
                                <div class="mb-3"><label class="form-label">ประเภท</label><select class="form-select" id="txType"><option value="Income">รายรับ</option><option value="Expense">รายจ่าย</option></select></div>
                                <div class="mb-3"><label class="form-label">หมวดหมู่</label><input type="text" class="form-control" id="txCategory" required></div>
                                <div class="mb-3"><label class="form-label">จำนวนเงิน</label><input type="number" step="0.01" class="form-control" id="txAmount" required></div>
                                <div class="mb-3"><label class="form-label">วันที่</label><input type="date" class="form-control" id="txDate" required></div>
                                <button type="submit" class="btn btn-success w-100 fw-bold">บันทึกธุรกรรม</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Calendar -->
                <div class="col-lg-8">
                    <div class="card shadow-sm p-3">
                        <h5 class="mb-3 text-secondary fw-bold"><i class="fas fa-calendar-alt me-2"></i>ปฏิทินงาน</h5>
                        <div id="calendar"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
    <script>
        function toggleAuthModal(isRegister) {
            document.getElementById('loginForm').classList.toggle('d-none', isRegister);
            document.getElementById('registerForm').classList.toggle('d-none', !isRegister);
            document.getElementById('authTitle').innerText = isRegister ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ';
        }
    </script>
</body>
</html>
